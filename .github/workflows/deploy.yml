name: Deploy App

# test → build images on GitHub's runners → push to GHCR → the VPS only pulls and restarts.
# The VPS never builds: the frontend build alone took ~8 min there and hit the SSH timeout.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-app
  # Never kill a deploy halfway through; a newer push waits and deploys right after.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/bekzhank1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: monty-backend/requirements.txt
      - name: Backend tests
        working-directory: monty-backend
        run: |
          pip install -r requirements.txt pytest
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: monty-frontend/package-lock.json
      - name: Frontend typecheck and tests
        working-directory: monty-frontend
        run: |
          npm ci
          npx tsc -b
          npx vitest run

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: monty-backend
            build_args: ""
          - service: frontend
            context: monty-frontend
            # Must match docker-compose.yml.
            build_args: VITE_API_URL=https://api.moodlog.me
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/monty-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/monty-${{ matrix.service }}:latest
          # Links the package to this repo so the deploy job's token can pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Layer cache: unchanged requirements / package-lock skip pip / npm install.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull and restart on the VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          # Short-lived job token, only valid while this job runs.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 10m
          script_stop: true
          script: |
            cd ~/monty

            # Compose file and server-side config come from git; code comes from the images.
            git fetch origin main
            git reset --hard origin/main
            touch monty-backend/.env
            mkdir -p monty-backend/log

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose pull backend frontend
            docker compose up -d --no-build --remove-orphans
            docker logout ghcr.io

            docker image prune -f
