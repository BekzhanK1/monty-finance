version: '3.8'

services:
  db:
    image: postgres:15
    command: postgres -c max_connections=20 -c shared_buffers=64MB -c work_mem=4MB -c maintenance_work_mem=16MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bekzhan2004
      POSTGRES_DB: monty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 30s
      retries: 5

  backend:
    # Built and pushed by CI (.github/workflows/deploy.yml); `build` stays for local builds.
    image: ghcr.io/bekzhank1/monty-backend:${IMAGE_TAG:-latest}
    build: ./monty-backend
    env_file: ./monty-backend/.env
    ports:
      - "8000:8000"
    environment:
      - STAGE=PROD
      - DATABASE_URL=postgresql://postgres:bekzhan2004@db:5432/monty
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Code lives in the image now; only Siri logs persist on the host.
      - ./monty-backend/log:/app/log
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: ghcr.io/bekzhank1/monty-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./monty-frontend
      args:
        VITE_API_URL: https://api.moodlog.me
    ports:
      - "5173:5173"

volumes:
  postgres_data:
